# components.yaml — Platform-Agnostic Component Specs
#
# Single source of truth for all UI components across H5 (Web) and Android.
# Generated by scripts/design-system/figma_sync_components.py from Figma.
# Consumed by:
#   scripts/design-system/generate_css.py    → components.css (H5)
#   scripts/design-system/generate_android.py → Android styles.xml
#
# All values reference tokens from tokens/tokens.css.
# Format: {category.tokenName} → resolves to CSS var(--xxx) or Android @color/xxx.

meta:
  source: figma
  figma_file_key: "PLACEHOLDER"  # Replace with actual Figma file key
  generated_by: figma_sync_components.py

components:

  # ── Buttons ──────────────────────────────────────────────────────
  btn-primary:
    description: "主操作按钮，每页最多一个"
    figma_component_id: "PLACEHOLDER"
    base:
      display: inline-flex
      align-items: center
      justify-content: center
      gap: "{spacing.sm}"
      padding: "{spacing.md} {spacing.xl}"
      height: "48px"
      border-radius: "{radius.btn}"
      border: none
      cursor: pointer
      background:
        type: gradient-linear
        angle: 135deg
        stops:
          - "{color.primary} 0%"
          - "{color.primaryLight} 100%"
      typography:
        font-size: "{typography.size.md}"
        font-weight: "{typography.weight.semibold}"
        color: "{text.primary}"
    states:
      hover:
        transform: translateY(-1px)
        box-shadow: "{shadow.md}"
      disabled:
        background:
          type: solid
          color: "{text.muted}"
        color: "{text.caption}"
        cursor: not-allowed
      loading:
        cursor: wait
        # Spinner icon replaces text content

  btn-secondary:
    description: "次要操作按钮"
    figma_component_id: "PLACEHOLDER"
    base:
      extends: btn-primary  # Inherits base layout from btn-primary
      background:
        type: solid
        color: "{border.default}"
      typography:
        color: "{text.primary}"
    states:
      hover:
        background:
          color: "{border.surfaceHover}"

  btn-outline:
    description: "轮廓按钮（收藏、关注等）"
    base:
      extends: btn-primary
      background:
        type: solid
        color: transparent
      border: "1.5px solid {color.primary}"
      typography:
        color: "{color.primary}"

  btn-sm:
    description: "小按钮（标签、筛选等）"
    base:
      extends: btn-primary
      padding: "{spacing.sm} {spacing.lg}"
      height: "32px"
      border-radius: "{radius.md}"
      typography:
        font-size: "{typography.size.sm}"

  # ── Cards ────────────────────────────────────────────────────────
  drama-card:
    description: "剧集卡片，用于推荐列表和搜索结果"
    figma_component_id: "PLACEHOLDER"
    base:
      border-radius: "{radius.card}"
      background: "{background.card}"
      overflow: hidden
      cursor: pointer
    parts:
      thumb:
        aspect-ratio: "3/4"
        background:
          type: gradient-linear
          angle: 135deg
          stops:
            - "{color.primary} 0%"
            - "{background.cardDeep} 100%"
        position: relative
        display: flex
        align-items: flex-end
        padding: "{spacing.md}"
      badge:
        background: "{color.primary90}"
        color: "{text.primary}"
        font-size: "{typography.size.xs}"
        padding: "{spacing.xs} {spacing.sm}"
        border-radius: "{radius.xs}"
        font-weight: "{typography.weight.semibold}"
      info:
        padding: "{spacing.md} {spacing.md} {spacing.md}"
      title:
        color: "{text.primary}"
        font-size: "{typography.size.sm}"
        font-weight: "{typography.weight.semibold}"
        lines: 2
        overflow: ellipsis
      rating:
        color: "{color.rating}"
        font-size: "{typography.size.xs}"
        margin-top: "{spacing.xs}"
    states:
      hover:
        transform: translateY(-3px)
        box-shadow: "{shadow.lg}"

  continue-watching-card:
    description: "继续观看卡片，显示进度条和上次观看信息"
    figma_component_id: "PLACEHOLDER"
    base:
      display: flex
      gap: "{spacing.md}"
      background: "{background.card}"
      border-radius: "{radius.card}"
      padding: "{spacing.md}"
      cursor: pointer
      border: "1px solid {color.primaryTint}"
    parts:
      thumb:
        width: "80px"
        aspect-ratio: "3/4"
        border-radius: "{radius.md}"
        background:
          type: gradient-linear
          angle: 135deg
          stops:
            - "{background.deep} 0%"
            - "{background.cardDeep} 100%"
        flex-shrink: 0
      info:
        flex: 1
        title:
          color: "{text.primary}"
          font-size: "{typography.size.base}"
          font-weight: "{typography.weight.semibold}"
        episode:
          color: "{text.tertiary}"
          font-size: "{typography.size.sm}"
          margin-top: "{spacing.xs}"
      progress-bar:
        height: "4px"
        background: "{border.default}"
        border-radius: "2px"
        overflow: hidden
      progress-fill:
        height: "100%"
        background:
          type: gradient-linear
          angle: 90deg
          stops:
            - "{color.primary} 0%"
            - "{color.primaryLight} 100%"

  # ── Inputs ───────────────────────────────────────────────────────
  form-input:
    description: "表单输入框（邮箱、密码、搜索）"
    base:
      width: "100%"
      padding: "{spacing.md} {spacing.lg}"
      border-radius: "{radius.btn}"
      border: "1.5px solid {border.default}"
      background: "{border.surfaceSubtle}"
      color: "{text.primary}"
      font-size: "{typography.size.base}"
      outline: none
      height: "48px"
    states:
      focus:
        border-color: "{color.primary}"
      placeholder:
        color: "{text.muted}"
    variants:
      search:
        border-radius: "{radius.2xl}"

  # ── Tags ─────────────────────────────────────────────────────────
  tag:
    description: "分类标签 / 状态标签"
    base:
      display: inline-block
      padding: "{spacing.xs} {spacing.md}"
      border-radius: "14px"
      background: "{color.primaryTint}"
      color: "{color.primaryLight}"
      font-size: "{typography.size.sm}"
      font-weight: "{typography.weight.medium}"
    variants:
      danger:
        background: "rgba(225, 112, 85, 0.15)"
        color: "{color.danger}"
      success:
        background: "rgba(0, 184, 148, 0.15)"
        color: "{color.success}"

  # ── Progress ─────────────────────────────────────────────────────
  progress-bar:
    description: "进度条"
    base:
      height: "4px"
      background: "{border.default}"
      border-radius: "2px"
      overflow: hidden
    parts:
      fill:
        height: "100%"
        background:
          type: gradient-linear
          angle: 90deg
          stops:
            - "{color.primary} 0%"
            - "{color.primaryLight} 100%"
        border-radius: "2px"

  # ── Navigation ───────────────────────────────────────────────────
  bottom-nav:
    description: "底部导航栏（Android 原生实现，H5 由 Android WebView 壳提供）"
    base:
      display: flex
      background: "{background.card}"
      border-top: "1px solid {border.subtle}"
      height: "{device.bottomNavHeight}"
    parts:
      item:
        flex: 1
        display: flex
        flex-direction: column
        align-items: center
        gap: "2px"
        padding: "{spacing.sm} 0"
        color: "{text.caption}"
        font-size: "{typography.size.xs}"
        icon-size: "22px"
      item-active:
        color: "{color.primary}"

  # ── Toast ────────────────────────────────────────────────────────
  toast:
    description: "操作反馈 Toast（底部浮现，1.8s 消失）"
    base:
      display: inline-flex
      background: "rgba(0,0,0,0.85)"
      color: "{text.primary}"
      padding: "{spacing.md} {spacing.xl}"
      border-radius: "10px"
      font-size: "{typography.size.sm}"
      backdrop-filter: blur(8px)
      white-space: nowrap
      position: fixed
      bottom: "80px"
      left: "50%"
      transform: translateX(-50%)
      z-index: "{z.toast}"
    animation:
      in: "fadeIn 0.2s ease"
      out: "fadeOut 0.2s ease 1.6s"

  # ── Skeleton ─────────────────────────────────────────────────────
  skeleton:
    description: "骨架屏加载占位"
    base:
      background: "{background.skeleton}"
      border-radius: "{radius.sm}"

  # ── Banner ───────────────────────────────────────────────────────
  banner-carousel:
    description: "首页 Banner 轮播，16:7 比例"
    base:
      width: "100%"
      aspect-ratio: "16/7"
      border-radius: "{radius.xl}"
      overflow: hidden
      position: relative
    parts:
      slide:
        width: "100%"
        height: "100%"
        background:
          type: gradient-linear
          angle: 135deg
          stops:
            - "{color.primary} 0%"
            - "{background.deep} 100%"
      dots:
        position: absolute
        bottom: "{spacing.md}"
        left: "50%"
        transform: translateX(-50%)
        display: flex
        gap: "{spacing.sm}"
      dot:
        width: "6px"
        height: "6px"
        border-radius: "{radius.full}"
        background: "rgba(255,255,255,0.4)"
      dot-active:
        background: "{text.primary}"

  # ── Category Tabs ────────────────────────────────────────────────
  category-tabs:
    description: "分类标签栏（横向滚动）"
    base:
      display: flex
      gap: "{spacing.sm}"
      padding: "{spacing.md} {spacing.lg}"
      overflow-x: auto
    parts:
      tab:
        padding: "{spacing.sm} {spacing.lg}"
        border-radius: "{radius.2xl}"
        font-size: "{typography.size.sm}"
        color: "{text.secondary}"
        background: transparent
        white-space: nowrap
        cursor: pointer
      tab-active:
        background: "{color.primaryTint}"
        color: "{color.primaryLight}"
        font-weight: "{typography.weight.medium}"

  # ── Episode List Item ───────────────────────────────────────────
  episode-item:
    description: "剧集列表项"
    base:
      display: flex
      align-items: center
      gap: "{spacing.md}"
      padding: "{spacing.md} {spacing.lg}"
      border-bottom: "1px solid {border.subtle}"
      cursor: pointer
    parts:
      number:
        color: "{text.tertiary}"
        font-size: "{typography.size.sm}"
        width: "28px"
        text-align: center
      thumb:
        width: "60px"
        aspect-ratio: "16/9"
        border-radius: "{radius.sm}"
        background: "{background.skeleton}"
      info:
        flex: 1
        title:
          color: "{text.primary}"
          font-size: "{typography.size.base}"
        duration:
          color: "{text.tertiary}"
          font-size: "{typography.size.xs}"
