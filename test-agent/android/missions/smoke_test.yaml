  - "尝试浏览首页的推荐内容，滑动查看列表"
  - "尝试点击一个剧集进入详情"
  - "尝试播放一个视频（如果有播放按钮）"
  - "验证播放器界面正常显示"
  - "返回首页，确认状态正常"

expected_screens:
